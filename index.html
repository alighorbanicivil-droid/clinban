<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="claude:viewport-fit-sides" content="cover">
<title>کلین‌بان</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 56'%3E%3Cpath d='M24 2 44 9v18c0 13-8.5 22-20 27C12.5 49 4 40 4 27V9z' fill='%23c8962e'/%3E%3Crect x='20' y='16' width='8' height='25' rx='2.6' fill='%2314213d'/%3E%3Crect x='11.5' y='24.5' width='25' height='8' rx='2.6' fill='%2314213d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: desktop = right-hand sidebar + content column; phone = top bar + bottom tabs. Navy and gold on a cool neutral ground. */
:root {
  --font: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
  --bg: #eef1f7;
  --surface: #ffffff;
  --soft: #f3f5fa;
  --fg: #14213d;
  --muted: #5a6479;
  --line: #dde2ed;
  --hero: #14213d;
  --on-hero: #f3f5fa;
  --on-hero-muted: #b4bfd8;
  --gold: #c8962e;
  --gold-ink: #8a6213;
  --btn-bg: #14213d;
  --btn-fg: #ffffff;
  --ok: #1f7a4d;
  --ok-bg: #e2f3ea;
  --warn: #9a5a06;
  --warn-bg: #fdf0d9;
  --danger: #b3261e;
  --danger-bg: #fbe6e4;
  --shadow: 0 1px 2px rgba(20, 33, 61, 0.06), 0 8px 24px rgba(20, 33, 61, 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120;
    --surface: #141c32;
    --soft: #1a2440;
    --fg: #e8ecf6;
    --muted: #9aa5bf;
    --line: #25314f;
    --hero: #1a2850;
    --on-hero: #f3f5fa;
    --on-hero-muted: #aeb9d6;
    --gold: #e0b04e;
    --gold-ink: #e0b04e;
    --btn-bg: #e0b04e;
    --btn-fg: #101729;
    --ok: #62c48e;
    --ok-bg: #153325;
    --warn: #e5a14a;
    --warn-bg: #3a2a10;
    --danger: #f08a82;
    --danger-bg: #3d1b19;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120;
  --surface: #141c32;
  --soft: #1a2440;
  --fg: #e8ecf6;
  --muted: #9aa5bf;
  --line: #25314f;
  --hero: #1a2850;
  --on-hero: #f3f5fa;
  --on-hero-muted: #aeb9d6;
  --gold: #e0b04e;
  --gold-ink: #e0b04e;
  --btn-bg: #e0b04e;
  --btn-fg: #101729;
  --ok: #62c48e;
  --ok-bg: #153325;
  --warn: #e5a14a;
  --warn-bg: #3a2a10;
  --danger: #f08a82;
  --danger-bg: #3d1b19;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.8;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 18px; cursor: pointer; font-weight: 700;
  background: var(--btn-bg); color: var(--btn-fg); min-height: 44px; text-align: center;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn:hover { opacity: 0.92; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--soft); opacity: 1; }
.btn.block { width: 100%; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--fg);
}
.icon-btn:hover { background: var(--soft); }
:is(button, input, textarea, a):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 500; }
.control {
  width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 12px; padding: 11px 14px; min-height: 46px; min-width: 0;
}
.control:focus { border-color: var(--gold); }
.pw { position: relative; }
.pw .control { padding-inline-end: 48px; }
.pw .eye {
  position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%);
  width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: transparent;
  color: var(--muted); border-radius: 10px; cursor: pointer;
}
.pw .eye:hover { background: var(--soft); }
textarea.control { min-height: 132px; resize: vertical; direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.6; }
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 2px; }
.meter i { height: 4px; border-radius: 4px; background: var(--line); }
.meter[data-level="1"] i:nth-child(-n+1) { background: var(--danger); }
.meter[data-level="2"] i:nth-child(-n+2) { background: var(--warn); }
.meter[data-level="3"] i:nth-child(-n+3) { background: var(--ok); }
.meter[data-level="4"] i:nth-child(-n+4) { background: var(--ok); }
.hint { font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; padding: 10px 14px; border-radius: 12px; }
.msg.error { background: var(--danger-bg); color: var(--danger); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 5px; accent-color: var(--gold); flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 150px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 1px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.idle { background: var(--soft); color: var(--muted); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); align-content: start;
}
.card > h2, .card-head h2 { font-size: 16px; font-weight: 700; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- logo ---------- */
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo svg { width: 36px; height: 42px; flex: none; }
.logo b { font-size: 20px; line-height: 1.35; font-weight: 700; }
.logo small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

/* ---------- auth ---------- */
.auth {
  max-width: 980px; margin: 0 auto; display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr); align-items: stretch;
}
.brand {
  position: relative; overflow: hidden; border-radius: 22px; padding: 26px; display: grid; gap: 18px; align-content: start;
  background: var(--hero); color: var(--on-hero);
}
.brand::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-radial-gradient(circle at 0% 100%, transparent 0 26px, rgba(255, 255, 255, 0.06) 26px 27px);
}
.brand > * { position: relative; z-index: 1; }
.brand .logo small { color: var(--on-hero-muted); }
.brand h1 { font-size: 24px; line-height: 1.5; font-weight: 700; }
.brand h1 em { font-style: normal; color: var(--gold); }
.brand ul { list-style: none; margin: 0; padding: 0; display: none; gap: 12px; }
.brand li { display: flex; gap: 10px; align-items: flex-start; color: var(--on-hero-muted); font-size: 14px; }
.brand li svg { color: var(--gold); margin-top: 3px; }
.auth-form { display: grid; gap: 14px; align-content: center; }
.auth-form form { display: grid; gap: 16px; }
.auth-form h2 { font-size: 20px; }
@media (min-width: 860px) {
  body { padding-block: 40px; }
  #app.is-auth { min-height: calc(100vh - 80px); display: grid; align-items: center; }
  .auth { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); overflow: hidden; }
  .brand { border-radius: 0; padding: 40px; align-content: space-between; min-height: 520px; }
  .brand ul { display: grid; }
  .brand h1 { font-size: 28px; }
  .auth-form { padding: 40px; }
}

/* ---------- shell ---------- */
.shell { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); padding-bottom: 84px; }
.side { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.nav-item {
  display: flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; text-align: start;
  border-radius: 12px; padding: 10px 14px; color: var(--muted); font-weight: 500;
}
.tabs .nav-item { flex-direction: column; justify-content: center; gap: 4px; width: 100%; height: 60px; padding: 4px 2px; font-size: 12px; line-height: 1.3; text-align: center; min-width: 0; border-radius: 14px; }
.tabs .nav-item svg { width: 22px; height: 22px; flex: 0 0 22px; }
.nav-item:hover { background: var(--soft); }
.nav-item[aria-current="page"] { color: var(--fg); background: var(--soft); font-weight: 700; }
.nav-item[aria-current="page"] svg { color: var(--gold-ink); }
@media (min-width: 900px) {
  body { padding-block: 28px; }
  .shell { grid-template-columns: 236px minmax(0, 1fr); gap: 24px; padding-bottom: 0; align-items: start; }
  .side { display: grid; gap: 18px; position: sticky; top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
  .side nav { display: grid; gap: 4px; }
  .topbar, .tabs { display: none; }
}
.main { display: grid; gap: 16px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
.main > * { min-width: 0; max-width: 100%; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 16px; min-width: 0; }

.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 24px; background: var(--hero); color: var(--on-hero);
  display: grid; gap: 6px;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-radial-gradient(circle at 100% 0%, transparent 0 30px, rgba(255, 255, 255, 0.06) 30px 31px);
}
.hero > * { position: relative; z-index: 1; }
.hero .eyebrow { color: var(--gold); font-size: 13px; font-weight: 700; }
.hero h1 { font-size: 22px; line-height: 1.5; }
.hero p { color: var(--on-hero-muted); }
.hero .today { margin-top: 6px; font-weight: 700; font-size: 16px; }

.kv { display: grid; gap: 0; }
.kv > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv > div:last-child { padding-bottom: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 700; }
.cal .dow.fri { color: var(--danger); }
.cal .d { aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; border-radius: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.cal .d.fri { color: var(--danger); }
.cal .d.today { background: var(--btn-bg); color: var(--btn-fg); font-weight: 700; }
.cal.big { gap: 6px; }
.cal.big .d {
  aspect-ratio: auto; min-height: 74px; place-items: start; justify-items: start; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface);
}
.cal.big .d.fri { background: var(--soft); }
.cal.big .d.today { background: var(--btn-bg); border-color: var(--btn-bg); }
.cal.big .d.blank { border: 0; background: transparent; }
@media (max-width: 520px) { .cal.big .d { min-height: 54px; padding: 6px 7px; } .cal.big { gap: 4px; } }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-title { font-weight: 700; font-size: 16px; }

/* ---------- roadmap ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; position: relative; }
.steps li::before { content: ""; position: absolute; inset-inline-start: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700; z-index: 1; }
.steps .done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps .dot svg { width: 14px; height: 14px; }
.steps b { font-size: 14px; display: block; line-height: 1.6; }
.steps small { color: var(--muted); font-size: 13px; line-height: 1.6; display: block; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); font-weight: 700; }
/* Staff section tabs: every tab has the same width and height */
.seg.tab-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.seg.tab-grid button { min-height: 44px; padding: 8px 6px; font-size: 14px; line-height: 1.4; text-align: center; border-radius: 12px; white-space: normal; width: 100%; }
@media (min-width: 760px) { .seg.tab-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
/* ---------- staff & groups ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title { font-size: 22px; line-height: 1.4; }
.toolbar { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.toolbar .search { grid-column: 1 / -1; position: relative; display: block; }
.toolbar .search svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.toolbar .search .control { padding-inline-start: 40px; }
.toolbar .btn { grid-column: 1 / -1; }
@media (min-width: 760px) {
  .toolbar { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 0.8fr) auto; }
  .toolbar .search, .toolbar .btn { grid-column: auto; }
}
.emp-list { display: grid; gap: 8px; }
.emp {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: start;
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; cursor: pointer;
}
.emp:hover { background: var(--soft); }
.emp-main b { display: block; font-size: 15px; line-height: 1.5; }
.emp-main small { color: var(--muted); font-size: 13px; display: block; }
.emp-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) { .emp { grid-template-columns: auto minmax(0, 1fr); } .emp-tags { grid-column: 1 / -1; justify-content: flex-start; } }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--soft); color: var(--gold-ink); font-weight: 700; border: 1px solid var(--line); flex: none; }
.avatar.big { width: 72px; height: 72px; font-size: 22px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 4px; color: var(--muted); }
.empty b { color: var(--fg); }
.form-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.form-grid .wide { grid-column: 1 / -1; }
.photo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
textarea.control.plain { direction: rtl; text-align: start; font-family: var(--font); font-size: 15px; min-height: 84px; }
.btn.danger { color: var(--danger); border: 1px solid var(--danger); background: transparent; }
.btn.danger:hover { background: var(--danger-bg); opacity: 1; }
.confirm { display: grid; gap: 10px; background: var(--danger-bg); border-radius: 14px; padding: 14px; }
.confirm p { color: var(--danger); font-weight: 500; }
.group-list { display: grid; gap: 10px; }
.group-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; flex-wrap: wrap; }
.group-item.editing { display: block; }
.group-item .confirm { width: 100%; }
.group-main { display: grid; gap: 2px; min-width: 0; flex: 1 1 120px; }
.group-main small { color: var(--muted); font-size: 13px; }
.group-actions { display: flex; gap: 6px; }
.group-form { display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.kpi { font-size: 26px; font-weight: 700; color: var(--gold-ink); line-height: 1.2; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 120px) minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 13px; }
.bar { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 8px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.log li { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; padding-top: 0; }
.log small { color: var(--muted); font-size: 12px; }
/* ---------- date field + picker card ---------- */
.datebtn { display: flex; align-items: center; gap: 10px; text-align: start; cursor: pointer; color: var(--fg); }
.datebtn svg { color: var(--gold-ink); }
.datebtn-text.empty { color: var(--muted); }
.pk-backdrop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: auto; background: rgba(8, 14, 30, 0.55);
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pk-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); display: grid; gap: 12px; }
.pk-card:focus { outline: none; }
.pk-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.pk-selects { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 6px; }
.pk-selects .control { min-height: 40px; padding: 6px 8px; }
.pk-foot { display: flex; gap: 8px; flex-wrap: wrap; }
.pk-foot .btn { flex: 1 1 80px; min-height: 40px; padding: 8px 10px; }

.dk-col { flex: 0 0 210px; min-width: 0; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.dk-col.is-over { outline: 2px dashed var(--gold); outline-offset: -2px; }
.dk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 14px; }
.dk-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.dk-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; cursor: grab; }
.dk-card.is-bad { border-color: var(--danger); background: var(--danger-bg); }
.dk-card.is-warn { border-color: var(--warn); background: var(--warn-bg); }
.dk-name { font-weight: 600; font-size: 13px; }
.dk-card small { color: var(--muted); font-size: 12px; }
.dash { display: flex; flex-direction: column; gap: 12px; }
.dash-hero { padding-block: 8px; }
.dash-hero h1 { margin: 0; font-size: 20px; }
.dash-hero { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dash-hero .today { margin-inline-start: auto; }
.dash-brand { display: flex; align-items: center; gap: 10px; }
.dash-brand .rs-logo { width: 40px; height: 40px; border-radius: 12px; }
.dash-brand .rs-logo svg { width: 28px; }
.dash-brand small { display: block; color: var(--muted); font-size: 12px; }
.dash-clinic { display: block; font-size: 16px; }
.dash-main { display: flex; flex-direction: column; gap: 12px; }
.dash-cal .card, .dash-board .card { margin: 0; }
@media (min-width: 900px) {
  .dash { height: calc(100vh - 56px); min-height: 560px; }
  .dash-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); }
  .dash-cal, .dash-board { min-height: 0; display: flex; flex-direction: column; }
  .dash-cal > .card, .dash-board > .card { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .dash-board .kb-wrap { flex: 1; min-height: 0; align-items: stretch; }
  .dash-board .kb-col { overflow: hidden; }
  .dash-board .kb-card { padding: 5px 7px; gap: 2px; }
  .dash-board .kb-col { padding: 8px; gap: 6px; }
  .dash-board .kb-head { font-size: 13px; }
  .dash-board .kb-wrap { gap: 8px; }
  .dash-board .kb-top { flex-wrap: nowrap; }
  .dash-board .kb-top b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-board .kb-top small { white-space: nowrap; flex: none; }
}
@media (max-width: 899px) {
  .kb-wrap { grid-template-columns: minmax(0, 1fr); }
}
.roster-tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
.roster-tools > .roster-date, .roster-tools > label.field { grid-column: 1 / -1; }
.roster-tools > label.field > span, .roster-tools .roster-date > span { font-size: 12px; }
.roster-tools .btn, .roster-tools .control, .roster-tools .roster-date button { min-height: 40px; font-size: 14px; border-radius: 10px; }
.roster-tools .btn { padding: 0 10px; margin: 0; }
.roster-tools .control { padding: 6px 10px; }
.busy-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 44px 24px; text-align: center; }
.busy-ring { width: 56px; height: 56px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--gold); animation: busy-spin 0.9s linear infinite; }
.busy-title { margin: 4px 0 0; font-size: 18px; }
.busy-step { margin: 0; min-height: 1.5em; color: var(--fg); opacity: 0.75; transition: opacity 0.3s ease; }
.busy-bar { position: relative; width: min(260px, 70%); height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.busy-bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: busy-slide 1.2s ease-in-out infinite; }
@keyframes busy-spin { to { transform: rotate(360deg); } }
@keyframes busy-slide { from { inset-inline-start: -40%; } to { inset-inline-start: 100%; } }
@media (prefers-reduced-motion: reduce) { .busy-ring, .busy-bar i { animation-duration: 3s; } }
.busy-card { padding: 34px 20px; }
.busy-rules { list-style: none; margin: 4px 0 0; padding: 0; width: min(360px, 100%); display: grid; gap: 6px; text-align: start; }
.busy-rule { display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--soft); font-size: 14px; }
.busy-rule .busy-rule-name { grid-column: 2; font-weight: 700; }
.busy-rule small { grid-column: 2; font-size: 12px; opacity: 0.75; }
.busy-dot { grid-row: 1 / span 2; width: 10px; height: 10px; border-radius: 50%; background: var(--line); animation: busy-pulse 1s ease-in-out infinite; }

.busy-rule.is-warn .busy-dot { background: var(--warn); animation: none; }
.busy-rule.is-bad .busy-dot { background: var(--danger); animation: none; }
.busy-rule.is-warn small { color: var(--warn); opacity: 1; }
.busy-rule.is-bad small { color: var(--danger); opacity: 1; }
.busy-rule.is-ok small { opacity: 0.9; }
@keyframes busy-pulse { 50% { opacity: 0.3; } }

<body>
<div id="app" dir="rtl"><div class="splash">در حال بارگذاری…</div></div>
<div id="picker-root" dir="rtl"></div>

<script id="sched-engine">
/* ===== موتور هوشمند برنامه‌ریزی شیفت =====
   منطق خالص: بدون DOM و بدون ذخیره‌سازی. اپ و آزمون‌ها از همین بخش استفاده می‌کنند.
   ctx = {
     employees   [{id, groupId, active, equalShare, firstName, lastName}]
     groups      [{id, name, shareEqual, minHours, maxHours}]
     shifts      [{id, kind, name, start, end, days, groups, min, mode}]
     patterns    {groupId: [shiftId, ...]}      (نبود کلید = همه‌ی شیفت‌های مجاز)
     rules       [{id, type, kind, groupId, value, mode, enabled, label}]
     assignments {dateKey: {employeeId: shiftId | leave}}   (generateMonth آن را تغییر می‌دهد)
     locks       {monthKey: {...}}                  (ماه‌های تأییدشده‌ی مدیر)
     today       dateKey
     leave       مقدار مرخصی
     cal         {idx(key), delta(key, d), dow(key), monthKeys(key), priorKeys(key), isOff(key)}
   */
  (function (root) {
    "use strict";
    var FA = "۰۱۲۳۴۵۶۷۸۹";
    function fa(v) { return String(v).replace(/\d/g, function (d) { return FA[+d]; }); }
    function hm(str) {
      var p = String(str || "").split(":");
      if (p.length !== 2 || !/^\d{1,2}$/.test(p[0]) || !/^\d{2}$/.test(p[1])) return null;
      var h = +p[0], m = +p[1];
      return h > 23 || m > 59 ? null : h * 60 + m;
    }
    // Start minute of the day and length of a shift (an end before the start means overnight).
    function span(s) {
      if (!s) return null;
      var a = hm(s.start), b = hm(s.end);
      if (a === null || b === null) return null;
      return { a: a, mins: ((b - a + 1440) % 1440) || 1440 };
    }
    function byName(a, b) { return (a.lastName + a.firstName).localeCompare(b.lastName + b.firstName, "fa"); }
    function fullName(e) { return e.firstName + " " + e.lastName; }
    function shiftOf(ctx, sid) { return (ctx.shifts || []).filter(function (s) { return s.id === sid; })[0] || null; }
    function groupOf(ctx, gid) { return (ctx.groups || []).filter(function (g) { return g.id === gid; })[0] || null; }
    function groupName(ctx, gid) { var g = groupOf(ctx, gid); return g ? g.name : "بدون گروه"; }
    function isWork(ctx, v) { return !!v && v !== ctx.leave && !!shiftOf(ctx, v); }
    function kindOf(ctx, sid) { var s = shiftOf(ctx, sid); return s ? (s.kind || s.id) : ""; }
    function shiftMins(ctx, sid) { var sp = span(shiftOf(ctx, sid)); return sp ? sp.mins : 0; }
    function cell(ctx, key, eid) { var d = ctx.assignments[key]; return d ? (d[eid] || "") : ""; }
    function rulesOf(ctx, type) { return (ctx.rules || []).filter(function (r) { return r.enabled && r.type === type; }); }
    function hardOf(list) { return list.filter(function (v) { return v.rule.mode === "hard"; }); }
    function shareOf(ctx, e) {
      if (e.equalShare === "yes") return true;
      if (e.equalShare === "no") return false;
      var g = groupOf(ctx, e.groupId); return !g || g.shareEqual !== false;
    }
    // Start and end (absolute minutes) of a shift that begins on day index D.
    function interval(ctx, sid, D) {
      var sp = span(shiftOf(ctx, sid)), st = D * 1440 + sp.a;
      return { st: st, en: st + sp.mins, kind: kindOf(ctx, sid) };
    }
    // Frozen = approved month (lock) or a day already past. Frozen days are never regenerated or edited.
    // Without eid: only a locked month counts. With eid: a past day is also frozen for a person who already has a record on it.
    function frozen(ctx, key, eid) {
      var lk = ctx.locks && ctx.locks[key.slice(0, 7)];
      if (lk) return true;
      if (eid === undefined || !ctx.today || !(key < ctx.today)) return false;
      return cell(ctx, key, eid) !== "";
    }
    // Allowed for an employee when the shift lists the group (or none) and the group pattern includes it.
    function allowed(ctx, s, e) {
      if (!s || !span(s)) return false;
      if ((s.groups || []).length && s.groups.indexOf(e.groupId) < 0) return false;
      var pat = (ctx.patterns || {})[e.groupId];
      return pat === undefined || pat.indexOf(s.id) >= 0;
    }
    // Personal exemption: a range of days in which the employee may not work some shift kinds.
    var EXEMPT_RULE = { id: "exempt", type: "exempt", label: "معافیت", mode: "hard", enabled: true };
    function exemptOf(e, key, kind) {
      var list = e.exemptions || [];
      for (var i = 0; i < list.length; i++) {
        var x = list[i];
        if (!x.from || !x.to || key < x.from || key > x.to) continue;
        if (x.kinds.indexOf("*") >= 0 || x.kinds.indexOf(kind) >= 0) return x;
      }
      return null;
    }
    // Every rule that would be broken if employee e works shift sid on day key.
    // Neighbouring days are read from ctx.assignments, so the same check serves generation and manual edits.
    function violations(ctx, e, key, sid) {
      var out = [];
      if (!isWork(ctx, sid)) return out;
      var D = ctx.cal.idx(key), me = interval(ctx, sid, D), kind = me.kind;
      var ex = exemptOf(e, key, kind);
      if (ex) out.push({ rule: EXEMPT_RULE, text: "معاف از این شیفت است" + (ex.reason ? " (" + ex.reason + ")" : "") });
      function at(d) { return cell(ctx, ctx.cal.delta(key, d), e.id); }
      // 1) rest between two shifts
      rulesOf(ctx, "restGap").forEach(function (r) {
        [-1, 1].forEach(function (d) {
          var nsid = at(d); if (!isWork(ctx, nsid)) return;
          var nx = interval(ctx, nsid, D + d);
          var gap = d < 0 ? me.st - nx.en : nx.st - me.en;
          if (gap < r.value * 60) out.push({ rule: r, text: "استراحت " + fa(Math.max(0, Math.floor(gap / 60))) + " ساعت؛ حداقل " + fa(r.value) + " ساعت لازم است" });
        });
      });
      // 2) a full day off after a night shift (the night ends the next morning)
      rulesOf(ctx, "nightOff").forEach(function (r) {
        var y = at(-1);
        if (isWork(ctx, y) && kindOf(ctx, y) === "night") out.push({ rule: r, text: "بعد از شب باید یک روز کامل استراحت باشد" });
        if (kind === "night" && isWork(ctx, at(1))) out.push({ rule: r, text: "شب است و روز بعد کار ثبت شده؛ بعد از شب باید یک روز کامل استراحت باشد" });
      });
      // 3) no evening shift followed by a morning shift
      rulesOf(ctx, "eveMorn").forEach(function (r) {
        if (kind === "morning" && isWork(ctx, at(-1)) && kindOf(ctx, at(-1)) === "evening") out.push({ rule: r, text: "عصر روز قبل و صبح امروز با هم مجاز نیست" });
        if (kind === "evening" && isWork(ctx, at(1)) && kindOf(ctx, at(1)) === "morning") out.push({ rule: r, text: "عصر امروز و صبح روز بعد با هم مجاز نیست" });
      });
      // 4) longest run of consecutive days (optionally only one kind of shift)
      rulesOf(ctx, "maxRun").forEach(function (r) {
        if (r.kind !== "*" && r.kind !== kind) return;
        var run = 1, d, v;
        for (d = -1; d > -60; d--) { v = cell(ctx, ctx.cal.delta(key, d), e.id); if (!isWork(ctx, v) || (r.kind !== "*" && kindOf(ctx, v) !== r.kind)) break; run++; }
        for (d = 1; d < 60; d++) { v = cell(ctx, ctx.cal.delta(key, d), e.id); if (!isWork(ctx, v) || (r.kind !== "*" && kindOf(ctx, v) !== r.kind)) break; run++; }
        if (run > r.value) out.push({ rule: r, text: "بیش از " + fa(r.value) + " روز متوالی (" + fa(run) + " روز)" });
      });
      return out;
    }
    // Per-employee counters over a set of days.
    function addTo(ctx, x, sid, key, off) {
      var kind = kindOf(ctx, sid);
      x.kinds[kind] = (x.kinds[kind] || 0) + 1;
      x.mins += shiftMins(ctx, sid);
      if (off) x.off++;
      if (!x.lastKind[kind] || key > x.lastKind[kind]) x.lastKind[kind] = key;
      if (key > x.lastAny) x.lastAny = key;
    }
    function stats(ctx, keys) {
      var st = {};
      (ctx.employees || []).forEach(function (e) { st[e.id] = { kinds: {}, mins: 0, off: 0, lastKind: {}, lastAny: "" }; });
      keys.forEach(function (k) {
        var day = ctx.assignments[k] || {}, off = ctx.cal.isOff(k);
        Object.keys(day).forEach(function (eid) {
          var x = st[eid], sid = day[eid];
          if (x && isWork(ctx, sid)) addTo(ctx, x, sid, k, off);
        });
      });
      return st;
    }
    // This month plus the two months before (history carries over between months).
    function combined(S, id) {
      var c = S.cur[id], p = S.prior[id];
      if (!p) return c;
      var kinds = {}, lastKind = {};
      Object.keys(c.kinds).concat(Object.keys(p.kinds)).forEach(function (q) { kinds[q] = (c.kinds[q] || 0) + (p.kinds[q] || 0); });
      Object.keys(c.lastKind).concat(Object.keys(p.lastKind)).forEach(function (q) {
        var a = c.lastKind[q] || "", b = p.lastKind[q] || "";
        lastKind[q] = a > b ? a : b;
      });
      var la = c.lastAny || "", lb = p.lastAny || "";
      return { kinds: kinds, off: c.off + p.off, mins: c.mins + p.mins, lastKind: lastKind, lastAny: la > lb ? la : lb };
    }
    // Candidate order for one shift kind: fewest of that kind, fewest off-days (on off-days),
    // fewest hours, the one waiting longest for this kind, then the one whose last shift is oldest.
    function fairCompare(a, b, kind, off) {
      var ka = a.x.kinds[kind] || 0, kb = b.x.kinds[kind] || 0;
      if (ka !== kb) return ka - kb;
      if (off && a.x.off !== b.x.off) return a.x.off - b.x.off;
      if (a.x.mins !== b.x.mins) return a.x.mins - b.x.mins;
      var la = a.x.lastKind[kind] || "", lb = b.x.lastKind[kind] || "";
      if (la !== lb) return la < lb ? -1 : 1;
      var aa = a.x.lastAny || "", ab = b.x.lastAny || "";
      if (aa !== ab) return aa < ab ? -1 : 1;
      return byName(a.e, b.e);
    }
    function underCap(ctx, S, e, s) {
      var g = groupOf(ctx, e.groupId);
      if (!g || !g.maxHours) return true;
      return (S.cur[e.id].mins + shiftMins(ctx, s.id)) / 60 <= g.maxHours;
    }
    // Plain-language reasons why nobody in the pool can take the shift, grouped and counted.
    function reasons(ctx, S, key, pool, s, needShare, day) {
      if (!pool.length) return ["هیچ کارمند فعالی در این گروه نیست"];
      var count = {}, order = [];
      pool.forEach(function (e) {
        if (day[e.id] === s.id) return;
        var r = blocker(ctx, S, key, day, e, s, needShare);
        if (!r) r = "کسی در وضعیت مناسب نیست";
        if (!count[r]) { count[r] = 0; order.push(r); }
        count[r]++;
      });
      return order.sort(function (a, b) { return count[b] - count[a]; }).slice(0, 4).map(function (r) { return fa(count[r]) + " نفر: " + r; });
    }
    // The first reason a person cannot take shift s on day key ("" = can take it).
    function blocker(ctx, S, key, day, e, s, needShare) {
      if (day[e.id] !== undefined && day[e.id] !== "") return day[e.id] === ctx.leave ? "مرخصی یا استعلاجی" : "همان روز شیفت دیگری دارد";
      if (needShare && !shareOf(ctx, e)) return "گروهش در تقسیم مساوی شرکت ندارد";
      if (!allowed(ctx, s, e)) return "شیفت برای گروه یا الگوی زمانی این نفر مجاز نیست";
      if (!underCap(ctx, S, e, s)) return "سقف ساعت ماهانه گروهش پر است";
      var bad = hardOf(violations(ctx, e, key, s.id));
      return bad.length ? bad[0].text : "";
    }
    // Fills the empty slots of one day. Hard group minimums first, then the plain shift minimums.
    function generateDay(ctx, S, key, gid) {
      var dow = ctx.cal.dow(key), off = ctx.cal.isOff(key);
      var day = ctx.assignments[key] || (ctx.assignments[key] = {});
      var emps = (ctx.employees || []).filter(function (e) { return e.active && (!gid || e.groupId === gid); }).sort(byName);
      var picks = [], short = [];
      function inScope(s) { return !gid || (s.groups || [])[0] === gid; }
      function pick(list, s) {
        var kind = kindOf(ctx, s.id);
        list.sort(function (a, b) { return fairCompare({ e: a, x: combined(S, a.id) }, { e: b, x: combined(S, b.id) }, kind, off); });
        return list[0];
      }
      function place(e, s) {
        day[e.id] = s.id;
        addTo(ctx, S.cur[e.id], s.id, key, off);
        picks.push({ name: fullName(e), shift: s.name, employeeId: e.id, shiftId: s.id });
      }
      // 1) hard group minimums (e.g. one doctor on night shift)
      rulesOf(ctx, "minInGroup").forEach(function (r) {
        (ctx.shifts || []).filter(inScope).forEach(function (s) {
          if (!(r.kind === "*" || kindOf(ctx, s.id) === r.kind) || (s.days || []).indexOf(dow) < 0) return;
          if ((s.groups || [])[0] !== r.groupId || !span(s)) return;
          var have = emps.filter(function (e) { return day[e.id] === s.id && e.groupId === r.groupId; }).length;
          while (have < r.value) {
            var cands = emps.filter(function (e) { return e.groupId === r.groupId && !blocker(ctx, S, key, day, e, s, false); });
            if (!cands.length) break;
            place(pick(cands, s), s); have++;
          }
          if (have < r.value) {
            var pool = emps.filter(function (e) { return e.groupId === r.groupId; });
            short.push({ shift: groupName(ctx, r.groupId) + " · " + s.name, n: r.value - have, reasons: reasons(ctx, S, key, pool, s, false, day) });
          }
        });
      });
      // 2) plain shift minimums, filled from groups that share equally
      (ctx.shifts || []).filter(inScope).filter(function (s) { return s.min > 0 && (s.days || []).indexOf(dow) >= 0 && span(s); })
        .sort(function (a, b) { return (a.mode === "mandatory" ? 0 : 1) - (b.mode === "mandatory" ? 0 : 1) || b.min - a.min; })
        .forEach(function (s) {
          var have = emps.filter(function (e) { return day[e.id] === s.id; }).length;
          while (have < s.min) {
            var cands = emps.filter(function (e) { return !blocker(ctx, S, key, day, e, s, true); });
            if (!cands.length) break;
            place(pick(cands, s), s); have++;
          }
          if (have < s.min) short.push({ shift: s.name, n: s.min - have, reasons: reasons(ctx, S, key, emps, s, true, day) });
        });
      return { picks: picks, short: short };
    }
    // Generates every open day of a month. Frozen days (locked or past) are skipped.
    // Returns the picks, the shortages with their reasons, and the frozen days left as they are.
    // startKey: the first day that may be generated; days before it keep whatever they have.
    function generateMonth(ctx, anyKey, gid, startKey) {
      var keys = ctx.cal.monthKeys(anyKey).filter(function (k) { return !startKey || k >= startKey; });
      var out = { filled: 0, days: [], short: [], frozenDays: [], removedExempt: 0 };
      // Open days: an assignment that now conflicts with an exemption is removed first.
      keys.forEach(function (k) {
        if (frozen(ctx, k) || !ctx.assignments[k]) return;
        var day = ctx.assignments[k];
        Object.keys(day).forEach(function (eid) {
          var e = (ctx.employees || []).filter(function (x) { return x.id === eid; })[0];
          if (e && !frozen(ctx, k, eid) && isWork(ctx, day[eid]) && exemptOf(e, k, kindOf(ctx, day[eid]))) { delete day[eid]; out.removedExempt++; }
        });
        if (!Object.keys(day).length) delete ctx.assignments[k];
      });
      var S = { cur: stats(ctx, ctx.cal.monthKeys(anyKey)), prior: stats(ctx, ctx.cal.priorKeys(anyKey)) };
      keys.forEach(function (k) {
        if (frozen(ctx, k)) { out.frozenDays.push(k); return; }
        var r = generateDay(ctx, S, k, gid);
        out.filled += r.picks.length;
        if (r.picks.length) out.days.push(k);
        if (r.short.length) out.short.push({ date: k, items: r.short });
        if (ctx.assignments[k] && !Object.keys(ctx.assignments[k]).length) delete ctx.assignments[k];
      });
      return out;
    }
    // Validates a month as it is saved: hard and soft rule breaks, shift minimums left open.
    function check(ctx, keys) {
      var hard = [], soft = [], short = [];

  // ---------- date picker card ----------

      var diff = (y - p.y) * 365 + ordinalJ(m, d) - ordinalJ(p.m, p.d);

  async function loadData() {
    var g = await kvGet(K_GROUPS);
    if (!g) {
      var now = new Date().toISOString();
      g = DEFAULT_GROUPS.map(function (n, i) { return { id: uid(), clinicId: CLINIC, name: n, titles: [], order: i, createdAt: now, updatedAt: now, deletedAt: null }; });
      await kvSet(K_GROUPS, g);
    }
    data.groups = g;
    var gchg = false;
    data.groups.forEach(function (g) { if (g.shareEqual === undefined) { g.shareEqual = g.name !== "پزشکان"; gchg = true; } });
    if (gchg) await kvSet(K_GROUPS, data.groups);
    data.employees = (await kvGet(K_EMP)) || [];
    data.audit = (await kvGet(K_AUDIT)) || [];
    data.assignments = (await kvGet(K_ASSIGN)) || {};
    var sh = await kvGet(K_SHIFTS);
    if (!sh) { sh = DEFAULT_SHIFTS.map(cloneShift); sh.forEach(function (s) { s.clinicId = CLINIC; s.deletedAt = null; }); await kvSet(K_SHIFTS, sh); }
    var schg = false, removedIds = ["friday", "holiday"];
    if (sh.some(function (s) { return removedIds.indexOf(s.id) >= 0; })) {
      sh = sh.filter(function (s) { return removedIds.indexOf(s.id) < 0; }); schg = true;
      Object.keys(data.assignments).forEach(function (k) {
        var m = data.assignments[k];
        Object.keys(m).forEach(function (eid) { if (removedIds.indexOf(m[eid]) >= 0) delete m[eid]; });
        if (!Object.keys(m).length) delete data.assignments[k];
      });
      await kvSet(K_ASSIGN, data.assignments);
    }
    sh.forEach(function (s) { if (!s.kind) { s.kind = SHIFT_KINDS.some(function (k) { return k[0] === s.id; }) ? s.id : "other"; schg = true; } });
    if (schg) await kvSet(K_SHIFTS, sh);
    data.shifts = sh;
    data.patterns = (await kvGet(K_PATTERNS)) || {};
    data.holidays = (await kvGet(K_HOL)) || [];
    data.locks = (await kvGet(K_LOCKS)) || {};
    await splitSharedShifts();
    var rl = await kvGet(K_RULES);
    data.rules = rl || defaultRules();
    if (!rl) await kvSet(K_RULES, data.rules);
    else {
      // common-core rules added in later versions are appended once, existing settings are kept
      var haveIds = data.rules.map(function (r) { return r.id; }), addedRule = false;
      defaultRules().forEach(function (d) {
        if (COMMON_RULE_IDS.indexOf(d.id) >= 0 && haveIds.indexOf(d.id) < 0) { data.rules.push(d); addedRule = true; }
      });
      if (addedRule) await kvSet(K_RULES, data.rules);
    }
  }
  // Every shift belongs to exactly one job group. Shared shifts (no group, or several groups) are
  // split into one copy per group; old shifts are soft-deleted and assignments/patterns follow the copy.
  async function splitSharedShifts() {
    var gs = liveGroups();
    if (!gs.length) return;
    var now = new Date().toISOString(), map = {}, changed = false;
    liveShifts().slice().forEach(function (sh) {
      if (sh.groups && sh.groups.length === 1 && gs.some(function (g) { return g.id === sh.groups[0]; })) return;
      var targets = (sh.groups || []).filter(function (x) { return gs.some(function (g) { return g.id === x; }); });
      if (!targets.length) targets = gs.map(function (g) { return g.id; });
      map[sh.id] = {};
      targets.forEach(function (gid) {
        var g = gs.filter(function (x) { return x.id === gid; })[0];
        var c = JSON.parse(JSON.stringify(sh));
        c.id = sh.id + "-" + gid; c.groups = [gid]; c.name = sh.name + " · " + g.name;
        c.clinicId = CLINIC; c.deletedAt = null; c.createdAt = now; c.updatedAt = now;
        if (!data.shifts.some(function (q) { return q.id === c.id; })) data.shifts.push(c);
        map[sh.id][gid] = c.id;
      });
      sh.deletedAt = now; sh.updatedAt = now; changed = true;
    });
    if (!changed) return;
    Object.keys(data.assignments).forEach(function (k) {
      var day = data.assignments[k];
      Object.keys(day).forEach(function (eid) {
        var sid = day[eid]; if (!map[sid]) return;
        var e = data.employees.filter(function (x) { return x.id === eid; })[0];
        var nid = e ? map[sid][e.groupId] : undefined;
        if (nid) day[eid] = nid; else delete day[eid];
      });
      if (!Object.keys(day).length) delete data.assignments[k];
    });
    Object.keys(data.patterns).forEach(function (gid) {
      var out = [];
      (data.patterns[gid] || []).forEach(function (id) {
        if (map[id]) { if (map[id][gid]) out.push(map[id][gid]); } else out.push(id);
      });
      data.patterns[gid] = out;
    });
    await kvSet(K_SHIFTS, data.shifts); await kvSet(K_ASSIGN, data.assignments); await kvSet(K_PATTERNS, data.patterns);
  }

      '<li>ردیف «کمبود نیرو» زیر جدول نشان می‌دهد کدام روز و کدام شیفت کم است.</li>' +
      '<li>تغییر دستی بعدی روی پیشنهادهای قبلی اثر دارد؛ پیشنهاد عادلانه شیفت‌های موجود را پاک نمی‌کند.</li>' +

      '<li><b>اعتبارسنجی:</b> دکمه‌ی «اعتبارسنجی برنامه» کل ماه را دوباره بررسی می‌کند: نقض قانون سخت، هشدار نرم، کمبود، و انحراف عدالت کلی و گروهی.</li></ul>' +

      '<h3>۱۰. گزارش عدالت</h3><ul>' +
      '<li>برای هر کارمند تعداد هر نوع شیفت، ساعت کل و روزهای تعطیل کاری ماه را نشان می‌دهد.</li>' +
      '<li>«انحراف» فاصله‌ی ساعت کار نفر از میانگین گروه خودش است. بیش از ±۱۵٪ نامتعادل است.</li>' +
      '<li>«محدوده ساعت» نشان می‌دهد نفر بالای سقف، زیر حداقل یا در محدوده است.</li></ul>' +

      '<h3>۱۱. محدودیت‌های فعلی</h3><ul>' +
      '<li>معافیت فردی: در فرم هر کارمند، بازه‌ی تاریخی و نوع شیفت‌های معاف را ثبت کنید. در آن بازه این فرد برای آن شیفت‌ها برنامه‌ریزی نمی‌شود.</li>' +
      '<li>افزودن قانون جدید هنوز امکان‌پذیر نیست؛ فقط قوانین موجود قابل تنظیم‌اند.</li>' +
      '<li>صف چرخش دیده‌نشدنی است و فهرست نوبت بعدی نشان داده نمی‌شود.</li></ul>' +
      '</section>';
  }

  async function onRule(form) {
    var id = form.elements["rl-id"].value, isNew = !id;
    var old = isNew ? null : (data.rules || []).filter(function (x) { return x.id === id; })[0];
    if (!isNew && !old) { state.rulesMsg = "این قانون پیدا نشد."; state.ruleEdit = null; return refreshRules(); }
    var type = isNew ? form.elements["rl-type"].value : old.type;
    var label = form.elements["rl-label"].value.trim();
    var mode = form.elements["rl-mode"].value === "soft" ? "soft" : "hard";
    var kind = form.elements["rl-kind"].value || "*", gid = form.elements["rl-group"].value;
    var value = 1;
    if (!label) { state.rulesMsg = "عنوان قانون را وارد کنید."; return refreshRules(); }
    if (RULE_MAX[type] !== undefined) {
      value = parseInt(normDigits(form.elements["rl-value"].value), 10);
      if (isNaN(value) || value < 0 || value > RULE_MAX[type]) { state.rulesMsg = "عدد باید بین ۰ و " + faDigits(RULE_MAX[type]) + " باشد."; return refreshRules(); }
    }
    if (type === "minInGroup" && !gid) { state.rulesMsg = "برای حداقل نیرو در گروه، گروه را انتخاب کنید."; return refreshRules(); }
    var rule = { id: isNew ? "r-" + uid() : old.id, type: type, label: label, value: value, mode: mode, enabled: isNew ? true : old.enabled, custom: isNew ? true : !!old.custom };
    if (type === "maxRun" || type === "minInGroup") rule.kind = kind;
    if (type === "minInGroup") rule.groupId = gid;
    var prev = data.rules.slice();
    if (isNew) data.rules.push(rule); else data.rules[data.rules.indexOf(old)] = rule;
    try {
      await kvSet(K_RULES, data.rules);
      await logAudit(isNew ? "افزودن قانون" : "ویرایش قانون", "برنامه‌ریزی", label);
      state.ruleEdit = null; state.rulesMsg = "";
    } catch (err) { data.rules = prev; state.rulesMsg = "ذخیره‌سازی ناموفق بود."; }
    refreshRules();
  }
  async function ruleRemove(id) {
    var r = (data.rules || []).filter(function (x) { return x.id === id; })[0];

    var c = ev.target.closest && ev.target.closest("[data-drag]");
    if (!c || !ev.dataTransfer) return;
    ev.dataTransfer.setData("text/plain", c.getAttribute("data-drag")); ev.dataTransfer.effectAllowed = "move";
  });
  document.addEventListener("dragover", function (ev) {
    var col = ev.target.closest && ev.target.closest("[data-drop]");
    if (!col) return;
    ev.preventDefault(); col.classList.add("is-over");
  });
  document.addEventListener("dragleave", function (ev) {
    var col = ev.target.closest && ev.target.closest("[data-drop]");
    if (col) col.classList.remove("is-over");
  });
  document.addEventListener("drop", function (ev) {
    var col = ev.target.closest && ev.target.closest("[data-drop]");
    if (!col) return;
    ev.preventDefault(); col.classList.remove("is-over");
    var id = ev.dataTransfer ? ev.dataTransfer.getData("text/plain") : "";
    if (id) rosterSet(id, state.rosterDay || jKeyOf(new Date()), col.getAttribute("data-drop"));
  });

  // ================= boot =================
  try { if (!inViewer) applyTheme(localStorage.getItem("cs-theme") || "system"); } catch (e) {}
  Promise.all([kvGet("auth.manager"), kvGet("clinic.name"), kvGet("clinic.logo")]).then(function (v) { state.clinicName = typeof v[1] === "string" ? v[1] : ""; state.clinicLogo = typeof v[2] === "string" ? v[2] : ""; state.screen = v[0] ? "login" : "setup"; render(); })
    .catch(function () { app.innerHTML = '<div class="splash"><p class="msg error">مرورگر اجازه ذخیره‌سازی نمی‌دهد. حالت خصوصی را خاموش کنید یا تنظیمات سایت را بررسی کنید.</p></div>'; });
})();
</script>
